name: Deploy React TypeScript App to Netlify

on:
  push:
    branches:
      - main
    paths:
      - 'react-ts-app/**'
  pull_request:
    branches:
      - main
    paths:
      - 'react-ts-app/**'
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  PROJECT_DIR: 'react-ts-app'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run lint

      - name: Type check
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx tsc --noEmit

      - name: Build project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=${{ env.PROJECT_DIR }}/dist --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Comment PR with deploy URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview deployed to Netlify! Check it out at: https://${{ secrets.NETLIFY_SITE_ID }}.netlify.app'
            })
